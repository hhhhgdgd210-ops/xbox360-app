name: Build Xbox 360 app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      DEVKITXENON: /usr/local/xenon
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential texinfo flex bison wget \
            libgmp-dev libmpfr-dev libmpc-dev libelf-dev libncurses-dev \
            zlib1g-dev libpng-dev libfreetype6-dev

      - name: Cache do toolchain
        id: cache-xenon
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/xenon
          key: xenon-toolchain-v1

      - name: Compilar toolchain e libxenon
        if: steps.cache-xenon.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p $DEVKITXENON && sudo chown -R $USER $DEVKITXENON
          git clone https://github.com/Free60Project/libxenon.git
          cd libxenon/toolchain
          ./build-xenon-toolchain toolchain
          export PATH=$PATH:$DEVKITXENON/bin:$DEVKITXENON/usr/bin
          ./build-xenon-toolchain libxenon
          ./build-xenon-toolchain libs

      - name: Salvar cache do toolchain
        if: steps.cache-xenon.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /usr/local/xenon
          key: xenon-toolchain-v1

      - name: Compilar o app
        run: |
          export PATH=$PATH:$DEVKITXENON/bin:$DEVKITXENON/usr/bin
          make

      - name: Enviar resultado
        uses: actions/upload-artifact@v4
        with:
          name: xbox360-app
          path: app.elf32
